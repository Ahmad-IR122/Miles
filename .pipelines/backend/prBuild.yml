trigger: none
pr:
  branches:
    include:
      - "*"
  paths:
    include:
      - backend/**
variables:
  pythonVersion: "3.11"
  PIP_CACHE_DIR: $(Pipeline.Workspace)/.pipcache
  group: BE-pipeline-env 
steps:
- task: UsePythonVersion@0
  inputs:
    versionSpec: $(pythonVersion)

- task: Cache@2
  inputs:
    key: 'pip | "$(Agent.OS)" | backend/requirements.txt'
    restoreKeys: |
      pip | "$(Agent.OS)"
    path: $(PIP_CACHE_DIR)

- script: |
    python -m pip install --upgrade pip
    pip install -r requirements.txt
  displayName: Install backend dependencies
  workingDirectory: backend

- script: |
    pip install ruff
    ruff check .
  displayName: Lint backend code
  workingDirectory: backend

- script: |
    python -c "from app.main import app"
  displayName: Build check (verify app imports)
  workingDirectory: backend