trigger: none
pr:
  branches:
    include:
      - "*"
  paths:
    include:
      - aiServices/**
variables:
- group: AI services environment variable
- name: pythonVersion
  value: "3.11"
- name: PIP_CACHE_DIR
  value: $(Pipeline.Workspace)/.pipcache

steps:
- task: UsePythonVersion@0
  inputs:
    versionSpec: $(pythonVersion)

- task: Cache@2
  inputs:
    key: 'pip | "$(Agent.OS)" | aiServices/requirements.txt'
    restoreKeys: |
      pip | "$(Agent.OS)"
    path: $(PIP_CACHE_DIR)


- script: |
    cd aiServices
    python -m pip install --upgrade pip
    pip install -r requirements.txt
  displayName: Install AI Services dependencies

- script: |
    python -c "from app.main import app"
  displayName: Build check (verify app imports)
  workingDirectory: aiServices
  env:
    AZURE_OPENAI_ENDPOINT: $(AZURE_OPENAI_ENDPOINT)
    AZURE_OPENAI_DEPLOYMENT: $(AZURE_OPENAI_DEPLOYMENT)
    AZURE_OPENAI_API_KEY: $(AZURE_OPENAI_API_KEY)
    AZURE_OPENAI_API_VERSION: $(AZURE_OPENAI_API_VERSION)
    AZURE_SEARCH_ENDPOINT: $(AZURE_SEARCH_ENDPOINT)
    AZURE_SEARCH_API_KEY: $(AZURE_SEARCH_API_KEY)
    AZURE_SEARCH_INDEX_NAME: $(AZURE_SEARCH_INDEX_NAME)
