trigger: none
pr:
  branches:
    include:
      - "*"
  paths:
    include:
      - aiServices/**
variables:
  pythonVersion: "3.11"
  PIP_CACHE_DIR: $(Pipeline.Workspace)/.pipcache

steps:
- task: UsePythonVersion@0
  inputs:
    versionSpec: $(pythonVersion)

- task: Cache@2
  inputs:
    key: 'pip | "$(Agent.OS)" | aiServices/requirements.txt'
    restoreKeys: |
      pip | "$(Agent.OS)"
    path: $(PIP_CACHE_DIR)


- script: |
    cd aiServices
    python -m pip install --upgrade pip
    pip install -r requirements.txt
  displayName: Install AI Services dependencies

- script: |
    python -c "from app.main import app"
  displayName: Build check (verify app imports)
  workingDirectory: aiServices
  env:
    AZURE_OPENAI_ENDPOINT: https://ci-placeholder.invalid
    AZURE_OPENAI_DEPLOYMENT: ci-placeholder
    AZURE_OPENAI_API_KEY: ci-placeholder
    AZURE_OPENAI_API_VERSION: 2025-03-01-preview
